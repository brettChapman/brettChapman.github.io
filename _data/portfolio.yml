# Portfolio items, grouped into sub-tabs on the Portfolio page (publications live in publications.yml).
# Each item: title, year, summary, tags (tools/methods), links (label + url),
# and optional note (shown in italics, e.g. "Confidential industry work").

projects:
  - title: Barley pangenome graph (76 genomes)
    year: 2020–2026
    summary: >-
      Led construction of the first barley genome graph, starting with 20 genomes and growing
      to 76, embedding population-wide micro- and macro-scale variation in a single queryable
      graph. First-author paper in Agriculture Communications (2026).
    tags: [PGGB, Minigraph-cactus, vg, odgi, Pawsey Setonix]
    links:
      - label: Paper
        url: https://doi.org/10.1016/j.agrcom.2026.100131

  - title: MultiVis
    year: 2018–2023
    summary: >-
      Open-source Python and D3.js package I designed and developed at ECU for statistical analysis and
      visualisation of multivariate omics data, including PCA and loadings plots, PCoA,
      clustered heatmaps, polar dendrograms, force-directed network plots and hierarchical edge bundles. 
      Published on PyPI, Conda and GitHub.
    tags: [Python, D3.js, Jupyter, statsmodels, scikit-learn, Seaborn, Matplotlib]
    links:
      - label: GitHub
        url: https://github.com/brettChapman/multivis
      - label: PyPI
        url: https://pypi.org/project/multivis/

  - title: paf2pav
    year: 2022
    summary: >-
      Linearises a PGGB/odgi pangenome graph into a presence/absence variation (PAV) matrix,
      with tools to merge matrices across chromosomes, ready for the Panache pangenome browser.
    tags: [Python, odgi, PAF, pangenomics]
    links:
      - label: GitHub
        url: https://github.com/brettChapman/paf2pav

  - title: VariantDB
    year: 2023
    summary: >-
      Variant annotation and comparison workflow for genetic testing results. Annotates variants
      against ClinVar and gnomAD and compares two individuals to flag shared genetic risk factors.
    tags: [Python, Jupyter, ClinVar, gnomAD, Docker]
    links:
      - label: GitHub
        url: https://github.com/brettChapman/VariantDB

  - title: Bioinformatics container builds
    year: 2020–2024
    summary: >-
      A collection of Docker and Singularity builds for genome annotation, alignment and
      graphical pangenomics on HPC systems, used to keep large analyses reproducible.
    tags: [Docker, Singularity, HPC]
    links:
      - label: GitHub
        url: https://github.com/brettChapman/docker-builds

  - title: Slurm cluster on Pawsey Nimbus
    year: 2020
    summary: >-
      Scripts and a step-by-step guide for standing up a Slurm cluster with NFS, Munge and
      Singularity on the Pawsey Nimbus research cloud (Nimbus now deprecated, but the guide is still useful).
    tags: [Slurm, Bash, NFS, Singularity, Pawsey]
    links:
      - label: Guide
        url: https://brettchapman.github.io/Nimbus_Cluster/
      - label: GitHub
        url: https://github.com/brettChapman/Nimbus_Cluster

  - title: WCGA Barley and Oatdatabase tutorials
    year: 2026
    summary: >-
      Co-authored tutorials for the Western Crop Genetics Alliance Barley and Oat databases.
    tags: [Databases, Barley, Oat, JBrowse, Panache, Tutorials]
    links:
      - label: Zenodo
        url: https://doi.org/10.5281/zenodo.21448532

