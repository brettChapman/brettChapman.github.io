analyses:
  - title: Longitudinal RNA-seq for RNA therapeutics
    year: 2024–2026
    summary: >-
      Statistical analysis plans and longitudinal differential expression with repeated-measures
      linear mixed-effects models across clinical cohorts and control cell lines, with
      ORA and GSEA.
    tags: [limma, edgeR, DESeq2, mixed models, GSEA]
    links: []
    note: Confidential industry work (PYC Therapeutics)

  - title: Variant annotation and clinical interpretation
    year: 2024–2026
    summary: >-
      Variant annotation and functional consequence assessment across clinical cohorts in
      rare-disease programs, feeding genotype–phenotype interpretation.
    tags: [VEP, ClinVar, gnomAD]
    links: []
    note: Confidential industry work (PYC Therapeutics)

  - title: Structural variation in wild and domesticated barley
    year: 2024
    summary: >-
      Contributed pangenome and structural variation analysis to the international barley
      pangenome consortium across domesticated and wild germplasm.
    tags: [Pangenomics, Structural variation, HPC]
    links:
      - label: Nature 2024
        url: https://doi.org/10.1038/s41586-024-08187-1

  - title: Barley and oat pan-transcriptomes
    year: 2025–2026
    summary: >-
      Contributed to pan-transcriptome analyses showing genotype-dependent transcriptional
      complexity in barley and building a pangenome and pantranscriptome of hexaploid oat.
    tags: [RNA-seq, Pan-transcriptomics, Salmon, STAR]
    links:
      - label: Nature Genetics 2025
        url: https://doi.org/10.1038/s41588-024-02069-y
      - label: Nature 2026
        url: https://doi.org/10.1038/s41586-025-09676-7

  - title: GWAS and genotyping of crop genomes
    year: 2020–2024
    summary: >-
      Genotyped crop populations from short- and long-read data and ran genome-wide association
      studies for barley breeding research at the Western Crop Genetics Alliance.
    tags: [GWAS, Linkage disequilibrium, Illumina, PacBio HiFi]
    links:
      - label: Plant Biotech J 2023
        url: https://doi.org/10.1111/pbi.14077

  - title: Metabolomics case studies
    year: 2018–2023
    summary: >-
      Twelve reproducible notebooks across two published datasets (athlete metabolomics at
      altitude and gastric cancer NMR) covering univariate statistics, PCA, PCoA, clustering
      and network analysis. Runs in the browser through Binder.
    tags: [Python, Jupyter, Binder, multivariate statistics]
    links:
      - label: Notebooks
        url: https://github.com/brettChapman/multivis_tutorials

  - title: Proteogenomics for genome annotation
    year: 2011–2017
    summary: >-
      Developed a bioinformatics framework that uses mass spectrometry evidence to improve
      gene models, applied to bread wheat, grapevine and bacterial genomes.
    tags: [MS/MS, Proteogenomics, Genome annotation]
    links:
      - label: Grapevine (Proteomics 2017)
        url: https://doi.org/10.1002/pmic.201700197
      - label: Bacterial case study (Proteomics 2014)
        url: https://doi.org/10.1002/pmic.201400185
