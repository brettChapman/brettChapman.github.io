---
layout: default
---
<article class="page">
  {% if page.heading != false %}
  <header class="page-header">
    <h1 class="page-title">{{ page.heading | default: page.title }}</h1>
    {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  </header>
  {% endif %}
  {{ content }}
</article>
