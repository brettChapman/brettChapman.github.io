---
layout: default
---
<article class="page post">
  <header class="page-header">
    <p class="post-date">{{ page.date | date: "%-d %B %Y" }}</p>
    <h1 class="page-title">{{ page.title }}</h1>
  </header>
  {{ content }}
  <p class="back-link"><a href="{{ '/notes/' | relative_url }}">&larr; All notes</a></p>
</article>
